# /etc/nginx/sites-available/torusmc.com
# Reverse proxy for the TorusMC website container (127.0.0.1:3000).
# Requires the Let's Encrypt certificate from step 4 of Deployment/README.md.
# Real visitor IPs behind Cloudflare: see conf.d/cloudflare-realip.conf (step 5).

upstream torusmc_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP -> HTTPS. (Cloudflare usually redirects at the edge already.)
server {
    listen 80;
    listen [::]:80;
    server_name torusmc.com www.torusmc.com;

    location / {
        return 301 https://torusmc.com$request_uri;
    }
}

# HTTPS: www -> apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.torusmc.com;

    ssl_certificate     /etc/letsencrypt/live/torusmc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torusmc.com/privkey.pem;

    return 301 https://torusmc.com$request_uri;
}

# HTTPS: the website.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name torusmc.com;

    ssl_certificate     /etc/letsencrypt/live/torusmc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torusmc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # Hashed build assets never change: cache them for a year.
    location /_next/static/ {
        proxy_pass http://torusmc_web;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://torusmc_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Next.js streams responses; don't hold them back.
        proxy_buffering off;
    }
}
